<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Defter</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;700&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #f5f0e8;
    --paper: #fffef9;
    --ink: #1a1410;
    --muted: #8a7f70;
    --accent: #c8502a;
    --line: #e8e0d0;
    --shadow: rgba(30,20,10,0.10);
    --cat1: #e8c4a0;
    --cat2: #a8c8b0;
    --cat3: #b0b8d8;
    --cat4: #d8b0c0;
    --cat5: #c8d0a0;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--ink);
    min-height: 100vh;
    max-width: 430px;
    margin: 0 auto;
    position: relative;
    overflow-x: hidden;
  }

  /* HEADER */
  .header {
    padding: 52px 24px 20px;
    background: var(--bg);
    position: sticky;
    top: 0;
    z-index: 10;
  }

  .header-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 18px;
  }

  .app-title {
    font-family: 'Playfair Display', serif;
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -1px;
    line-height: 1;
    color: var(--ink);
  }

  .app-subtitle {
    font-size: 13px;
    color: var(--muted);
    margin-top: 3px;
    font-weight: 300;
  }

  .add-btn {
    width: 44px;
    height: 44px;
    background: var(--accent);
    border: none;
    border-radius: 14px;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 22px;
    box-shadow: 0 4px 14px rgba(200,80,42,0.35);
    transition: transform 0.15s, box-shadow 0.15s;
    flex-shrink: 0;
  }
  .add-btn:active { transform: scale(0.93); box-shadow: 0 2px 8px rgba(200,80,42,0.25); }

  /* CATEGORY SCROLL */
  .cat-scroll {
    display: flex;
    gap: 8px;
    overflow-x: auto;
    scrollbar-width: none;
    padding-bottom: 4px;
  }
  .cat-scroll::-webkit-scrollbar { display: none; }

  .cat-chip {
    flex-shrink: 0;
    padding: 7px 14px;
    border-radius: 20px;
    border: 1.5px solid transparent;
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.18s;
    background: var(--paper);
    color: var(--muted);
    border-color: var(--line);
    white-space: nowrap;
  }
  .cat-chip.active {
    background: var(--ink);
    color: var(--paper);
    border-color: var(--ink);
  }
  .cat-chip .cat-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 6px;
    vertical-align: middle;
  }

  /* NOTES LIST */
  .notes-area {
    padding: 16px 16px 100px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .section-label {
    font-size: 11px;
    font-weight: 500;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--muted);
    padding: 4px 8px 2px;
  }

  /* NOTE CARD */
  .note-card {
    background: var(--paper);
    border-radius: 18px;
    padding: 18px 18px 14px;
    box-shadow: 0 2px 12px var(--shadow);
    cursor: pointer;
    transition: transform 0.18s, box-shadow 0.18s;
    position: relative;
    overflow: hidden;
    animation: slideIn 0.3s ease;
  }
  .note-card:active { transform: scale(0.98); box-shadow: 0 1px 6px var(--shadow); }

  @keyframes slideIn {
    from { opacity: 0; transform: translateY(14px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .note-card-accent {
    position: absolute;
    top: 0; left: 0;
    width: 4px;
    height: 100%;
    border-radius: 18px 0 0 18px;
  }

  .note-card-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 8px;
    padding-left: 10px;
  }

  .note-title {
    font-family: 'Playfair Display', serif;
    font-size: 17px;
    font-weight: 700;
    color: var(--ink);
    line-height: 1.3;
    flex: 1;
  }

  .note-cat-badge {
    font-size: 11px;
    font-weight: 500;
    padding: 3px 9px;
    border-radius: 10px;
    margin-left: 8px;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .note-preview {
    font-size: 14px;
    color: var(--muted);
    line-height: 1.6;
    padding-left: 10px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .note-footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 12px;
    padding-left: 10px;
    border-top: 1px solid var(--line);
    padding-top: 10px;
  }

  .note-date {
    font-size: 12px;
    color: var(--muted);
    font-weight: 300;
  }

  .note-actions {
    display: flex;
    gap: 4px;
  }

  .icon-btn {
    width: 30px;
    height: 30px;
    border: none;
    background: none;
    cursor: pointer;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--muted);
    font-size: 15px;
    transition: background 0.15s, color 0.15s;
  }
  .icon-btn:active { background: var(--line); color: var(--ink); }
  .icon-btn.delete:active { color: #c83030; }

  /* EMPTY STATE */
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: var(--muted);
  }
  .empty-icon { font-size: 52px; margin-bottom: 14px; }
  .empty-title { font-family: 'Playfair Display', serif; font-size: 22px; color: var(--ink); margin-bottom: 6px; }
  .empty-sub { font-size: 14px; font-weight: 300; }

  /* MODAL BACKDROP */
  .modal-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(20,15,10,0.5);
    z-index: 50;
    backdrop-filter: blur(4px);
    align-items: flex-end;
  }
  .modal-backdrop.open { display: flex; animation: fadeIn 0.2s ease; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  .modal {
    width: 100%;
    max-width: 430px;
    margin: 0 auto;
    background: var(--paper);
    border-radius: 24px 24px 0 0;
    padding: 24px 20px 40px;
    animation: slideUp 0.3s cubic-bezier(0.34,1.56,0.64,1);
    max-height: 92vh;
    overflow-y: auto;
  }
  @keyframes slideUp {
    from { transform: translateY(100%); }
    to { transform: translateY(0); }
  }

  .modal-handle {
    width: 36px;
    height: 4px;
    background: var(--line);
    border-radius: 2px;
    margin: 0 auto 20px;
  }

  .modal-title {
    font-family: 'Playfair Display', serif;
    font-size: 22px;
    font-weight: 700;
    margin-bottom: 18px;
    color: var(--ink);
  }

  .field-label {
    font-size: 12px;
    font-weight: 500;
    letter-spacing: 1px;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
    display: block;
  }

  .field-input {
    width: 100%;
    border: 1.5px solid var(--line);
    background: var(--bg);
    border-radius: 12px;
    padding: 12px 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    color: var(--ink);
    outline: none;
    transition: border-color 0.18s;
    margin-bottom: 14px;
  }
  .field-input:focus { border-color: var(--accent); }

  textarea.field-input {
    resize: none;
    min-height: 140px;
    line-height: 1.7;
  }

  .cat-picker {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin-bottom: 20px;
  }

  .cat-opt {
    padding: 7px 13px;
    border-radius: 20px;
    border: 1.5px solid var(--line);
    font-size: 13px;
    font-weight: 500;
    cursor: pointer;
    color: var(--muted);
    background: var(--paper);
    transition: all 0.15s;
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .cat-opt .dot {
    width: 9px; height: 9px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .cat-opt.selected {
    border-color: var(--ink);
    background: var(--ink);
    color: white;
  }

  .save-btn {
    width: 100%;
    padding: 15px;
    background: var(--accent);
    color: white;
    border: none;
    border-radius: 14px;
    font-family: 'DM Sans', sans-serif;
    font-size: 16px;
    font-weight: 500;
    cursor: pointer;
    box-shadow: 0 4px 14px rgba(200,80,42,0.3);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .save-btn:active { transform: scale(0.97); box-shadow: 0 2px 8px rgba(200,80,42,0.2); }

  .cancel-btn {
    width: 100%;
    padding: 13px;
    background: transparent;
    color: var(--muted);
    border: none;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    cursor: pointer;
    margin-top: 8px;
  }

  /* VIEW MODAL */
  .view-modal-title {
    font-family: 'Playfair Display', serif;
    font-size: 26px;
    font-weight: 700;
    line-height: 1.3;
    margin-bottom: 6px;
    color: var(--ink);
  }
  .view-modal-meta {
    font-size: 12px;
    color: var(--muted);
    margin-bottom: 20px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .view-modal-content {
    font-size: 15px;
    line-height: 1.85;
    color: var(--ink);
    white-space: pre-wrap;
    padding-bottom: 10px;
  }
  .view-modal-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
    border-top: 1px solid var(--line);
    padding-top: 16px;
  }
  .view-edit-btn {
    flex: 1;
    padding: 13px;
    background: var(--ink);
    color: var(--paper);
    border: none;
    border-radius: 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
  }
  .view-del-btn {
    padding: 13px 18px;
    background: #fce8e8;
    color: #c83030;
    border: none;
    border-radius: 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 15px;
    font-weight: 500;
    cursor: pointer;
  }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-top">
    <div>
      <div class="app-title">Defter</div>
      <div class="app-subtitle" id="noteCount">0 not</div>
    </div>
    <button class="add-btn" onclick="openAddModal()">+</button>
  </div>
  <div class="cat-scroll" id="catScroll"></div>
</div>

<!-- NOTES AREA -->
<div class="notes-area" id="notesArea"></div>

<!-- ADD/EDIT MODAL -->
<div class="modal-backdrop" id="addModal" onclick="closeAddModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <div class="modal-title" id="modalHeading">Yeni Not</div>

    <label class="field-label">BAŞLIK</label>
    <input class="field-input" id="noteTitle" placeholder="Notunun başlığı..." />

    <label class="field-label">İÇERİK</label>
    <textarea class="field-input" id="noteContent" placeholder="Buraya yaz..."></textarea>

    <label class="field-label">KATEGORİ</label>
    <div class="cat-picker" id="catPicker"></div>

    <button class="save-btn" onclick="saveNote()">Kaydet</button>
    <button class="cancel-btn" onclick="closeAddModal()">İptal</button>
  </div>
</div>

<!-- VIEW MODAL -->
<div class="modal-backdrop" id="viewModal" onclick="closeViewModal(event)">
  <div class="modal" onclick="event.stopPropagation()">
    <div class="modal-handle"></div>
    <div class="view-modal-title" id="viewTitle"></div>
    <div class="view-modal-meta" id="viewMeta"></div>
    <div class="view-modal-content" id="viewContent"></div>
    <div class="view-modal-actions">
      <button class="view-edit-btn" onclick="editFromView()">✏️ Düzenle</button>
      <button class="view-del-btn" onclick="deleteFromView()">🗑 Sil</button>
    </div>
  </div>
</div>

<script>
const CATS = [
  { id: 'kisisel', label: 'Kişisel', color: '#c8502a', bg: '#fce8df' },
  { id: 'is',      label: 'İş',      color: '#2a7a50', bg: '#dff0e8' },
  { id: 'fikir',   label: 'Fikir',   color: '#2a50c8', bg: '#dfe8f0' },
  { id: 'alisveris', label: 'Alışveriş', color: '#8a2ac8', bg: '#eedfff' },
  { id: 'diger',   label: 'Diğer',   color: '#7a6030', bg: '#f0eadf' },
];

let notes = JSON.parse(localStorage.getItem('defter_notes') || '[]');
let activeFilter = 'all';
let editingId = null;
let viewingId = null;
let selectedCat = 'kisisel';

function save() {
  localStorage.setItem('defter_notes', JSON.stringify(notes));
}

function getCat(id) {
  return CATS.find(c => c.id === id) || CATS[CATS.length - 1];
}

function formatDate(iso) {
  const d = new Date(iso);
  return d.toLocaleDateString('tr-TR', { day:'numeric', month:'long', year:'numeric' });
}

// RENDER CATEGORIES
function renderCats() {
  const scroll = document.getElementById('catScroll');
  const allCount = notes.length;
  scroll.innerHTML = `<button class="cat-chip ${activeFilter==='all'?'active':''}" onclick="setFilter('all')">Tümü (${allCount})</button>`;
  CATS.forEach(c => {
    const cnt = notes.filter(n => n.cat === c.id).length;
    if (cnt === 0) return;
    scroll.innerHTML += `<button class="cat-chip ${activeFilter===c.id?'active':''}" onclick="setFilter('${c.id}')">
      <span class="cat-dot" style="background:${c.color}"></span>${c.label} (${cnt})
    </button>`;
  });
}

function setFilter(id) {
  activeFilter = id;
  renderAll();
}

// RENDER NOTES
function renderNotes() {
  const area = document.getElementById('notesArea');
  const filtered = activeFilter === 'all' ? notes : notes.filter(n => n.cat === activeFilter);
  const count = document.getElementById('noteCount');
  count.textContent = `${notes.length} not`;

  if (filtered.length === 0) {
    area.innerHTML = `<div class="empty">
      <div class="empty-icon">📒</div>
      <div class="empty-title">Henüz not yok</div>
      <div class="empty-sub">+ butonuna basarak ilk notunu ekle</div>
    </div>`;
    return;
  }

  // Group by category
  const groups = {};
  filtered.forEach(n => {
    if (!groups[n.cat]) groups[n.cat] = [];
    groups[n.cat].push(n);
  });

  let html = '';
  Object.entries(groups).forEach(([catId, catNotes]) => {
    const cat = getCat(catId);
    if (Object.keys(groups).length > 1) {
      html += `<div class="section-label">${cat.label}</div>`;
    }
    catNotes.forEach(n => {
      html += `<div class="note-card" onclick="openView('${n.id}')">
        <div class="note-card-accent" style="background:${cat.color}"></div>
        <div class="note-card-header">
          <div class="note-title">${escHtml(n.title)}</div>
          <span class="note-cat-badge" style="background:${cat.bg};color:${cat.color}">${cat.label}</span>
        </div>
        <div class="note-preview">${escHtml(n.content)}</div>
        <div class="note-footer">
          <span class="note-date">${formatDate(n.date)}</span>
          <div class="note-actions">
            <button class="icon-btn" onclick="event.stopPropagation();openEdit('${n.id}')">✏️</button>
            <button class="icon-btn delete" onclick="event.stopPropagation();deleteNote('${n.id}')">🗑</button>
          </div>
        </div>
      </div>`;
    });
  });
  area.innerHTML = html;
}

function renderAll() {
  renderCats();
  renderNotes();
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

// CAT PICKER
function renderCatPicker() {
  const picker = document.getElementById('catPicker');
  picker.innerHTML = CATS.map(c => `
    <div class="cat-opt ${selectedCat===c.id?'selected':''}" onclick="selectCat('${c.id}')">
      <span class="dot" style="background:${c.color}"></span>${c.label}
    </div>
  `).join('');
}

function selectCat(id) {
  selectedCat = id;
  renderCatPicker();
}

// ADD MODAL
function openAddModal() {
  editingId = null;
  selectedCat = 'kisisel';
  document.getElementById('modalHeading').textContent = 'Yeni Not';
  document.getElementById('noteTitle').value = '';
  document.getElementById('noteContent').value = '';
  renderCatPicker();
  document.getElementById('addModal').classList.add('open');
  setTimeout(() => document.getElementById('noteTitle').focus(), 350);
}

function closeAddModal(e) {
  if (!e || e.target === document.getElementById('addModal')) {
    document.getElementById('addModal').classList.remove('open');
  }
}

function openEdit(id) {
  const n = notes.find(n => n.id === id);
  if (!n) return;
  editingId = id;
  selectedCat = n.cat;
  document.getElementById('modalHeading').textContent = 'Notu Düzenle';
  document.getElementById('noteTitle').value = n.title;
  document.getElementById('noteContent').value = n.content;
  renderCatPicker();
  document.getElementById('addModal').classList.add('open');
}

function saveNote() {
  const title = document.getElementById('noteTitle').value.trim();
  const content = document.getElementById('noteContent').value.trim();
  if (!title) { document.getElementById('noteTitle').focus(); return; }

  if (editingId) {
    const idx = notes.findIndex(n => n.id === editingId);
    notes[idx] = { ...notes[idx], title, content, cat: selectedCat, date: new Date().toISOString() };
  } else {
    notes.unshift({ id: Date.now().toString(), title, content, cat: selectedCat, date: new Date().toISOString() });
  }
  save();
  renderAll();
  closeAddModal();
}

// VIEW MODAL
function openView(id) {
  const n = notes.find(n => n.id === id);
  if (!n) return;
  viewingId = id;
  const cat = getCat(n.cat);
  document.getElementById('viewTitle').textContent = n.title;
  document.getElementById('viewMeta').innerHTML = `
    <span style="background:${cat.bg};color:${cat.color};padding:3px 9px;border-radius:10px;font-size:12px;font-weight:500">${cat.label}</span>
    <span>${formatDate(n.date)}</span>
  `;
  document.getElementById('viewContent').textContent = n.content;
  document.getElementById('viewModal').classList.add('open');
}

function closeViewModal(e) {
  if (!e || e.target === document.getElementById('viewModal')) {
    document.getElementById('viewModal').classList.remove('open');
  }
}

function editFromView() {
  document.getElementById('viewModal').classList.remove('open');
  openEdit(viewingId);
}

function deleteFromView() {
  if (confirm('Bu notu silmek istediğine emin misin?')) {
    deleteNote(viewingId);
    document.getElementById('viewModal').classList.remove('open');
  }
}

function deleteNote(id) {
  notes = notes.filter(n => n.id !== id);
  save();
  renderAll();
}

// INIT with sample notes
if (notes.length === 0) {
  notes = [
    { id:'1', title:'Kitap Listesi', cat:'kisisel', date: new Date().toISOString(),
      content:'• Dune – Frank Herbert\n• Suç ve Ceza – Dostoyevski\n• Sapiens – Yuval Noah Harari\n\nBunları bu ay bitirmeye çalışacağım.' },
    { id:'2', title:'Sprint Hedefleri', cat:'is', date: new Date(Date.now()-86400000).toISOString(),
      content:'Bu hafta tamamlanacaklar:\n1. API entegrasyonu\n2. Kullanıcı testleri\n3. Rapor hazırla\n\nSon teslim: Cuma' },
    { id:'3', title:'Uygulama Fikri', cat:'fikir', date: new Date(Date.now()-172800000).toISOString(),
      content:'Alışkanlık takip uygulaması — günlük streak sistemi, bildirimler ve haftalık özet grafikler.\n\nBunun için Flutter veya React Native kullanılabilir.' },
  ];
  save();
}

renderAll();
</script>
</body>
</html>
